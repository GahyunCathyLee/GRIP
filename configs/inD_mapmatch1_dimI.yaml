# =========================
# EXPERIMENT SETTING
# =========================
exp:
  feature_mode: 'dimI'
  device: 'cuda:0'
  seed: 42

# =========================
# DATA PATHS & PARAMS
# =========================
data:
  base_dir: 'inD_mapmatch1'
  batch_size: 1024
  batch_size_val: 1024
  num_workers: 4
  history_frames: 6
  future_frames: 15
  persistent_workers: False

# =========================
# MODEL PARAMS (GRIP++)
# =========================
model:
  max_hop: 2
  num_node: 9
  edge_importance_weighting: true

# =========================
# TRAINING PARAMS
# =========================
train:
  epochs: 1
  lr: 0.0001
  weight_decay: 0.0001
  ckpt_dir: 'ckpts'
